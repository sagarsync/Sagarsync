[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Custom headers for AI discovery files
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "all"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

# SPA client-side routing: serve index.html for all paths
# Netlify serves static files first, so prerendered /about/index.html
# will be served before this rewrite kicks in
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
